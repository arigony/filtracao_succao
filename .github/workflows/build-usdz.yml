name: Build mobile AR models

on:
  push:
    paths:
      - "scripts/generate-ios-usdz.mjs"
      - "scripts/generate-android-glb.mjs"
      - "js/apparatus.js"
      - "vendor/addons/exporters/GLTFExporter.js"
      - "vendor/addons/exporters/USDZExporter.js"
      - "vendor/addons/libs/fflate.module.js"
      - "vendor/addons/utils/TextureUtils.js"
      - ".github/workflows/build-usdz.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ar-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Export mobile AR models
        run: npm run generate:ar-models

      - name: Verify mobile AR models
        run: |
          for step in {1..8}; do
            test -s "assets/models/filtracao-step-${step}.usdz"
          done
          test -s "assets/models/filtracao-completa.usdz"
          test -s "assets/models/filtracao-completa.glb"
          ls -lh assets/models/filtracao-*.usdz assets/models/filtracao-completa.glb

      - name: Commit generated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/models/filtracao-*.usdz assets/models/filtracao-completa.glb
          if git diff --cached --quiet; then
            echo "AR models already up to date."
            exit 0
          fi
          git commit -m "Build mobile AR models"
          git push origin "HEAD:${GITHUB_REF_NAME}"
